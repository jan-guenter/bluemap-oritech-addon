name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "7e07f4e74ec1e92a6ead9aa1e66054af3e133aac"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install exact BlueMap add-on toolkit
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps --require-hashes --only-binary=:all: \
            --requirement requirements/toolkit.txt
          toolkit_version="$(sed -n \
            's#^bluemap-addon-toolkit @ .*/releases/download/v\([^/]*\)/.*#\1#p' \
            requirements/toolkit.txt)"
          [[ "${toolkit_version}" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "$(bluemap-addon-toolkit --version)" = "${toolkit_version}"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Acquire exact ephemeral Oritech input
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/oritech-neoforge-1.21.1-1.2.10.jar" \
            "https://www.curseforge.com/api/v1/mods/1030830/files/8556549/download"
          test "$(stat -c %s "${input_dir}/oritech-neoforge-1.21.1-1.2.10.jar")" \
            -eq 10990540
          sha256sum --check <<SHA256SUMS
          7c17c78ac55d9cbb71a9108a2bec7e2659192e08c5a1b49026088f875dbde821  ${input_dir}/oritech-neoforge-1.21.1-1.2.10.jar
          SHA256SUMS

      - name: Verify exact migration candidate
        run: |
          input_dir="${RUNNER_TEMP}/exact-inputs"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PoritechJar="${input_dir}/oritech-neoforge-1.21.1-1.2.10.jar" \
            clean prototypeCheck build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-oritech-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
