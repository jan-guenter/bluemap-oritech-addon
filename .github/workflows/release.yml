name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable v* tag to release or resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"
          git -C .ci/bluemap fetch --force --tags origin
          test "$(git -C .ci/bluemap describe --exact-match --tags HEAD)" = \
            "v5.22-agent.backport-5.22-mc1.21.1-2"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install exact BlueMap add-on toolkit
        if: ${{ hashFiles('requirements/toolkit.txt') != '' }}
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps --require-hashes --only-binary=:all: \
            --requirement requirements/toolkit.txt
          toolkit_version="$(sed -n \
            's#^bluemap-addon-toolkit @ .*/releases/download/v\([^/]*\)/.*#\1#p' \
            requirements/toolkit.txt)"
          [[ "${toolkit_version}" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "$(bluemap-addon-toolkit --version)" = "${toolkit_version}"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Build and verify accepted bytes
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication
          test "$(stat -c %s \
            "build/libs/bluemap-oritech-addon-${VERSION}-sources.jar")" \
            -eq 23988
          test "$(stat -c %s build/publications/addon/pom-default.xml)" \
            -eq 1341
          test "$(stat -c %s build/publications/addon/module.json)" \
            -eq 2817
          sha256sum --check <<SHA256SUMS
          958ae6fa2ae5a17893cccc348d3a6ce90498ff16ded21a97b0575774b7698a8e  build/libs/bluemap-oritech-addon-${VERSION}.jar
          d8b3a391430a1a52d8efff61fec7b80d03449d4daf455c56ab28a474b6610858  build/libs/bluemap-oritech-addon-${VERSION}-sources.jar
          3329db0d084ac41b8ed858bce552e9ef67591bfb4dfa0c567267c734585a8552  build/publications/addon/pom-default.xml
          e768b4ec4bacdde766c1e35b322aad8003c5bf8bcd78a88a814cd6b38dfde147  build/publications/addon/module.json
          SHA256SUMS

      - name: Prepare release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-oritech-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-oritech-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-oritech-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-oritech-addon-${VERSION}.module.json"
          (cd release && sha256sum -- ./* > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)
          test "$(stat -c %s release/SHA256SUMS)" -eq 448
          test "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" = \
            f758d0a4f1b2780b6dd7d22d61074f888a6b444b3f827365b04480818a2b00a8

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Oritech Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release JARs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.jar

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
